name: Publish Skylet Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build, Validate & Publish Release
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Release Tag & Version Agreement
        run: |
          echo "Checking release preconditions..."
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Release tag: ${TAG_NAME}"
          
          # 1. Verify semantic tag format: vMAJOR.MINOR.PATCH
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '${TAG_NAME}' does not match strict semantic versioning format vMAJOR.MINOR.PATCH (e.g. v1.0.1)"
            exit 1
          fi
          
          # 2. Extract version without leading 'v'
          TAG_VERSION="${TAG_NAME#v}"
          
          # 3. Verify droplet.json version matches tag
          DROPLET_VERSION=$(python3 -c "import json; print(json.load(open('droplet.json'))['version'])")
          echo "droplet.json version: ${DROPLET_VERSION}"
          if [ "${DROPLET_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Version mismatch: droplet.json specifies '${DROPLET_VERSION}', but tag is '${TAG_NAME}' (expected '${TAG_VERSION}')"
            exit 1
          fi
          
          # 4. Verify tag commit is reachable from origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag commit is not reachable from origin/main. Releases must only originate from main."
            exit 1
          fi
          echo "Release pre-checks passed: Tag ${TAG_NAME} matches droplet.json version ${DROPLET_VERSION} on origin/main."

      - name: Select Xcode Toolchain
        run: |
          for app in /Applications/Xcode_16*.app; do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Setup DroppyKit SDK (Pinned Commit)
        run: |
          ./ci/setup-droppykit.sh "${RUNNER_TEMP}/droppykit"
          echo "${RUNNER_TEMP}/droppykit/Scripts" >> $GITHUB_PATH
          echo "DROPPYKIT_PATH=${RUNNER_TEMP}/droppykit" >> $GITHUB_ENV

      - name: Verify DroppyKit Version & Pinned Revision
        run: |
          droppykit version

      - name: Run Skylet Automated Unit Tests
        run: |
          swift run SkyletTestsRunner

      - name: Build Universal Shipping Droplet Bundle
        run: |
          droppykit build --arch universal

      - name: Validate Shipping Droplet Bundle
        run: |
          droppykit validate --no-submission

      - name: Verify Universal Mach-O Slices
        run: |
          if [ -d ".build/Fexly.droplet" ]; then
            file .build/Fexly.droplet/Contents/MacOS/*
            lipo -info .build/Fexly.droplet/Contents/MacOS/*
          elif [ -d ".build/Skylet.droplet" ]; then
            file .build/Skylet.droplet/Contents/MacOS/*
            lipo -info .build/Skylet.droplet/Contents/MacOS/*
          fi

      - name: Run DroppyKit Harness Checks
        run: |
          ./ci/run-harness-checks.sh ./shots

      - name: Package Release Bundle & Generate Checksum
        run: |
          cd .build
          DROPLET_DIR="Fexly.droplet"
          [ -d "$DROPLET_DIR" ] || DROPLET_DIR="Skylet.droplet"
          # Strip debug symbols to keep zip under 1.2MB
          strip -x "$DROPLET_DIR/Contents/MacOS/"* || true
          zip -r -9 Fexly.droplet.zip "$DROPLET_DIR"
          shasum -a 256 Fexly.droplet.zip > Fexly.droplet.zip.sha256
          cat Fexly.droplet.zip.sha256
          echo "RELEASE_SHA256=$(cat Fexly.droplet.zip.sha256 | awk '{print $1}')" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/Fexly.droplet.zip
            .build/Fexly.droplet.zip.sha256
          name: Fexly ${{ github.ref_name }} — Real-Time FX & Historical Graph Intelligence
          draft: false
          prerelease: false
          generate_release_notes: true
